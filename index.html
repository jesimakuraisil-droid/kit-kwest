<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Kit Kwest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: linear-gradient(160deg, #ffe3f1 0%, #e3e9ff 100%);
    font-family: "Press Start 2P", monospace;
  }
  #game-wrap {
    position: relative;
    width: 900px; max-width: 100vw;
    height: 500px; max-height: 100vh;
    margin: 0 auto;
    border: 5px solid #7a5a8c;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 6px 6px 0 rgba(120, 90, 150, 0.3);
    background: #cdeaff;
  }
  canvas { display:block; width:100%; height:100%; image-rendering: pixelated; image-rendering: crisp-edges; }

  /* HUD */
  #hud {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; align-items: center; gap: 12px;
    color: #6a4f7a; font-size: 9px; line-height: 1.6;
    pointer-events: none; text-shadow: 2px 2px 0 rgba(255,255,255,0.9);
  }
  #hud-xp-wrap {
    flex: 1; height: 10px; background: rgba(255,255,255,0.7);
    border: 2px solid #7a5a8c; overflow: hidden;
  }
  #hud-xp-fill { height: 100%; width: 0%; background: #ff9ecb; transition: width 0.2s; }

  #pause-btn {
    position: absolute; top: 8px; right: 8px;
    width: 34px; height: 34px; border: 2px solid #7a5a8c;
    background: #fff; color: #7a5a8c; font-family: inherit;
    font-size: 12px; cursor: pointer; box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    z-index: 5;
  }

  #hud-boss {
    margin-left: auto; font-size: 8px; color: #b06bc9;
    background: rgba(255,255,255,0.6); padding: 3px 6px; border: 1px solid rgba(176,107,201,0.4);
  }
  #hud-upgrade {
    position: absolute; top: 34px; left: 10px;
    font-size: 8px; color: #5d4a6b; background: rgba(255,255,255,0.85);
    padding: 3px 8px; border: 1px solid #7a5a8c; z-index: 4;
  }
  #attack-btn {
    position: absolute; right: 28px; bottom: 128px;
    width: 70px; height: 44px; border: 3px solid #b0453a;
    background: rgba(239, 154, 154, 0.95); color: #6b2b22;
    font-family: inherit; font-size: 10px; box-shadow: 3px 3px 0 rgba(0,0,0,0.25);
    z-index: 5; touch-action: none;
  }

  #achievements-panel {
    display: flex; flex-direction: column; gap: 8px; width: 420px;
    max-height: 300px; overflow-y: auto; padding: 4px;
  }
  .achievement-card {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 2px solid #ddd; padding: 8px 12px; text-align: left;
    opacity: 0.55;
  }
  .achievement-card.unlocked { opacity: 1; border-color: #ffd54f; }
  .achievement-icon { font-size: 16px; color: #ffb300; }
  .achievement-name { font-size: 9px; color: #5d4a6b; margin-bottom: 4px; }
  .achievement-desc { font-size: 7px; color: #a487b3; }

  .grid-panel {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    max-width: 560px; max-height: 300px; overflow-y: auto; padding: 6px;
  }

  .mode-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .mode-btn {
    padding: 8px 10px; font-family: inherit; font-size: 7px;
    border: 2px solid #a487b3; background: #fff; color: #a487b3; cursor: pointer;
  }
  .mode-btn.mode-selected { background: #ba68c8; color: #fff; border-color: #6b3a80; }
  .mode-btn[data-mode="demonic"].mode-selected { background: #c62828; border-color: #7a1414; color: #fff; }

  #sound-btn {
    position: absolute; top: 8px; right: 50px;
    width: 34px; height: 34px; border: 2px solid #7a5a8c;
    background: #fff; color: #7a5a8c; font-family: inherit;
    font-size: 12px; cursor: pointer; box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    z-index: 5;
  }

  #cheat-btn {
    position: absolute; bottom: 6px; left: 6px;
    width: 12px; height: 12px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.06);
    padding: 0; cursor: pointer; z-index: 20;
  }

  #screen-cheat, #screen-teleport {
    position: absolute; inset: 0; z-index: 30;
    background: rgba(40, 20, 50, 0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .cheat-box {
    background: #fff; border: 3px solid #7a5a8c; padding: 20px;
    text-align: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
  }
  .cheat-label { font-size: 10px; color: #5d4a6b; margin: 0 0 12px; }
  #cheat-input, #teleport-input {
    font-family: inherit; font-size: 11px; padding: 8px; width: 180px;
    border: 2px solid #7a5a8c; margin-bottom: 12px; text-align: center;
  }

  #toast {
    position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
    background: #fff; color: #6a4f7a; border: 2px solid #7a5a8c;
    padding: 6px 14px; font-size: 9px; z-index: 6;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  .hidden { display: none !important; }

  /* Controls */
  #joy-base {
    position: absolute; left: 24px; bottom: 24px;
    width: 100px; height: 100px; border-radius: 50%;
    background: rgba(255,255,255,0.45); border: 3px solid rgba(122,90,140,0.6);
    touch-action: none; z-index: 5;
  }
  #joy-knob {
    position: absolute; left: 30px; top: 30px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(186, 104, 200, 0.9); border: 2px solid #7a5a8c;
  }
  #jump-btn {
    position: absolute; right: 28px; bottom: 30px;
    width: 84px; height: 84px; border-radius: 50%;
    border: 3px solid #7a5a20; background: rgba(255, 214, 92, 0.95);
    color: #7a5a20; font-family: inherit; font-size: 10px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.25); z-index: 5; touch-action: none;
  }

  /* Overlay screens */
  .screen {
    position: absolute; inset: 0;
    background: rgba(255, 240, 250, 0.97);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; z-index: 10; color: #5d4a6b;
  }
  .title-main {
    font-size: 34px; margin: 0; color: #d16bb0;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(200,140,190,0.4);
    letter-spacing: 1px; line-height: 1.4;
  }
  .subtitle { font-size: 9px; color: #a487b3; margin: 10px 0 24px; letter-spacing: 1px; }
  .big-btn {
    padding: 14px 28px; font-size: 12px; font-family: inherit;
    border: 3px solid #6b3a55; border-radius: 0; margin: 8px;
    background: #ff9ecb; color: #6b3a55;
    cursor: pointer; box-shadow: 4px 4px 0 #d97fa8;
  }
  .big-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #d97fa8; }
  .small-btn {
    padding: 10px 16px; font-size: 9px; font-family: inherit;
    border: 2px solid #5d4a7a; border-radius: 0; margin: 6px;
    background: #e3d1f7; color: #5d4a7a; cursor: pointer;
    box-shadow: 3px 3px 0 rgba(93,74,122,0.3);
  }

  h2.screen-title { color: #b06bc9; margin: 0 0 16px; font-size: 14px; }

  /* Skins */
  .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 18px; border: 2px solid #e0b8e8; font-family: inherit;
    background: #fff; color: #a487b3; font-size: 9px; cursor: pointer;
  }
  .tab-active { background: #ba68c8; color: #fff; border-color: #6b3a80; }
  #gacha-panel { display: flex; flex-direction: column; align-items: center; }
  .coin-label { font-size: 11px; color: #d99b3f; margin-bottom: 10px; }
  .skin-preview { min-height: 130px; display: flex; align-items: center; justify-content: center; }
  .hint-text { font-size: 8px; color: #a487b3; margin-top: 10px; }

  #inventory-panel {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    max-width: 640px; max-height: 260px; overflow-y: auto; padding: 6px;
  }
  .skin-card {
    background: #fff; border-radius: 0; padding: 8px; width: 108px;
    border: 3px solid #ddd; text-align: center;
  }
  .skin-card.rarity-common { border-color: #b0bec5; }
  .skin-card.rarity-rare { border-color: #64b5f6; }
  .skin-card.rarity-epic { border-color: #ba68c8; }
  .skin-card.rarity-legendary { border-color: #ffd54f; box-shadow: 3px 3px 0 rgba(255,213,79,0.6); }
  .skin-card.rarity-mythic { border-color: #8a6fd8; box-shadow: 3px 3px 0 rgba(138,111,216,0.75), 0 0 12px rgba(138,111,216,0.6); }
  .skin-card.locked { opacity: 0.55; }
  .skin-card.equipped { outline: 3px solid #66bb6a; }
  .skin-swatch { width: 42px; height: 42px; border-radius: 0; margin: 0 auto 8px; border: 2px solid rgba(0,0,0,0.2); }
  .skin-name { font-size: 7px; color: #5d4a6b; margin-bottom: 4px; line-height: 1.3; }
  .skin-rarity { font-size: 7px; text-transform: uppercase; color: #a487b3; margin-bottom: 6px; }
  .equip-btn {
    font-family: inherit; font-size: 7px; padding: 5px 8px; border: none;
    background: #ba68c8; color: #fff; cursor: pointer;
  }
  .equip-btn:disabled { background: #66bb6a; }

  /* Upgrades */
  #upgrades-list, #weapons-list, #gamemode-list {
    display: flex; flex-direction: column; gap: 10px; width: 380px;
    max-height: 300px; overflow-y: auto; padding: 4px;
  }
  .upgrade-card {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 2px solid #ddd; padding: 10px 14px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
  }
  .upgrade-card.upgrade-locked { opacity: 0.45; }
  .upgrade-swatch { width: 30px; height: 30px; border: 2px solid rgba(0,0,0,0.2); flex-shrink: 0; }
  .upgrade-info { flex: 1; text-align: left; min-width: 0; overflow-wrap: break-word; }
  .upgrade-name { font-size: 9px; color: #5d4a6b; margin-bottom: 6px; }
  .upgrade-cost { font-size: 8px; color: #a487b3; margin-bottom: 4px; }
  .upgrade-desc { font-size: 7px; color: #b8a5c4; line-height: 1.4; }
  .activate-btn {
    font-family: inherit; padding: 8px 12px; font-size: 8px; border: none;
    background: #ffab91; color: #5d3a2b; cursor: pointer; flex-shrink: 0;
  }
  .activate-btn:disabled { background: #ddd; color: #888; }

  /* Question modal */
  #question-options { display: flex; flex-direction: column; gap: 10px; width: 300px; }
  .answer-btn {
    font-family: inherit; padding: 12px; border: 2px solid #ddd;
    background: #fff; color: #5d4a6b; font-size: 10px;
    cursor: pointer; box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
  }
  .answer-btn:hover { background: #f3e0f7; }
  #question-text { font-size: 12px; line-height: 1.7; margin-bottom: 20px; max-width: 340px; }
</style>
</head>
<body>

  <div id="game-wrap">
    <canvas id="game" width="900" height="500"></canvas>

    <div id="hud">
      <span id="hud-coins">🪙 0</span>
      <span id="hud-level">Lv.1</span>
      <div id="hud-xp-wrap"><div id="hud-xp-fill"></div></div>
      <span id="hud-studs">0 studs</span>
      <span id="hud-boss"></span>
    </div>
    <div id="hud-upgrade" class="hidden"></div>
    <div id="toast" class="hidden"></div>

    <button id="pause-btn">⏸</button>
    <button id="sound-btn">🔇</button>
    <button id="cheat-btn" aria-label=""></button>
    <button id="attack-btn" class="hidden">ATK</button>

    <div id="screen-cheat" class="hidden">
      <div class="cheat-box">
        <p class="cheat-label">Enter code:</p>
        <input type="text" id="cheat-input" autocomplete="off" spellcheck="false" />
        <div>
          <button class="small-btn" id="cheat-submit">OK</button>
          <button class="small-btn" id="cheat-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="screen-teleport" class="hidden">
      <div class="cheat-box">
        <p class="cheat-label">Teleport to studs:</p>
        <input type="number" id="teleport-input" autocomplete="off" placeholder="e.g. 100000" />
        <div>
          <button class="small-btn" id="teleport-submit">Go</button>
          <button class="small-btn" id="teleport-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="joy-base"><div id="joy-knob"></div></div>
    <button id="jump-btn">JUMP</button>

    <!-- Main menu -->
    <div id="screen-menu" class="screen">
      <h1 class="title-main" id="game-title">KIT KWEST</h1>
      <p class="subtitle">by iby</p>
      <div class="mode-row" id="mode-row">
        <button class="mode-btn" data-mode="easy">Easy</button>
        <button class="mode-btn" data-mode="normal">Normal</button>
        <button class="mode-btn" data-mode="hard">Hard</button>
        <button class="mode-btn" data-mode="demonic">Demonic</button>
      </div>
      <button class="big-btn" id="btn-play">Play</button>
      <div>
        <button class="small-btn" id="btn-menu-gamemode">Game Mode</button>
        <button class="small-btn" id="btn-menu-skins">Cat Skins</button>
        <button class="small-btn" id="btn-menu-upgrades">Upgrades</button>
        <button class="small-btn" id="btn-menu-weapons">Weapons</button>
      </div>
      <div>
        <button class="small-btn" id="btn-menu-accessories">Accessories</button>
        <button class="small-btn" id="btn-menu-achievements">Achievements</button>
      </div>
    </div>

    <!-- Pause menu -->
    <div id="screen-pause" class="screen hidden">
      <h2 class="screen-title">Paused</h2>
      <button class="big-btn" id="btn-resume">Resume</button>
      <div>
        <button class="small-btn" id="btn-pause-skins">Cat Skins</button>
        <button class="small-btn" id="btn-pause-upgrades">Upgrades</button>
        <button class="small-btn" id="btn-pause-weapons">Weapons</button>
      </div>
      <div>
        <button class="small-btn" id="btn-pause-accessories">Accessories</button>
        <button class="small-btn" id="btn-pause-achievements">Achievements</button>
        <button class="small-btn" id="btn-quit">Quit to Menu</button>
      </div>
      <div>
        <button class="small-btn hidden" id="btn-pause-teleport">🌀 Teleport</button>
      </div>
    </div>

    <!-- Skins: gacha + inventory -->
    <div id="screen-skins" class="screen hidden">
      <h2 class="screen-title">Cat Skins</h2>
      <div class="tabs">
        <button class="tab-btn" id="tab-gacha-btn">Spin</button>
        <button class="tab-btn" id="tab-inventory-btn">Inventory</button>
      </div>
      <div id="gacha-panel"></div>
      <div id="inventory-panel" class="hidden"></div>
      <button class="small-btn" id="btn-skins-back">Back</button>
    </div>

    <!-- Game Mode -->
    <div id="screen-gamemode" class="screen hidden">
      <h2 class="screen-title">Game Mode</h2>
      <p class="hint-text">Squid Game-inspired twists — pick one before you play</p>
      <div id="gamemode-list"></div>
      <button class="small-btn" id="btn-gamemode-back">Back</button>
    </div>

    <!-- Upgrades -->
    <div id="screen-upgrades" class="screen hidden">
      <h2 class="screen-title">Upgrades</h2>
      <div id="upgrades-list"></div>
      <button class="small-btn" id="btn-upgrades-back">Back</button>
    </div>

    <!-- Weapons -->
    <div id="screen-weapons" class="screen hidden">
      <h2 class="screen-title">Weapons</h2>
      <p class="hint-text">Used to attack bosses at range</p>
      <div id="weapons-list"></div>
      <button class="small-btn" id="btn-weapons-back">Back</button>
    </div>

    <!-- Accessories -->
    <div id="screen-accessories" class="screen hidden">
      <h2 class="screen-title">Accessories</h2>
      <div id="accessories-panel" class="grid-panel"></div>
      <button class="small-btn" id="btn-accessories-back">Back</button>
    </div>

    <!-- Achievements -->
    <div id="screen-achievements" class="screen hidden">
      <h2 class="screen-title">Achievements</h2>
      <div id="achievements-panel"></div>
      <button class="small-btn" id="btn-achievements-back">Back</button>
    </div>

    <!-- Question modal -->
    <div id="screen-question" class="screen hidden">
      <h2 class="screen-title">Terrain Gate</h2>
      <div id="question-text"></div>
      <div id="question-options"></div>
    </div>

    <!-- Game over -->
    <div id="screen-gameover" class="screen hidden">
      <h2 class="screen-title" style="color:#d16b6b;">Game Over</h2>
      <p id="gameover-stats"></p>
      <button class="big-btn" id="btn-retry">Retry</button>
      <button class="small-btn" id="btn-gameover-menu">Main Menu</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
